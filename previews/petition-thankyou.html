<!--
Preview fixture - the petition widget's THANK-YOU state (after a successful
signature). Hand-built, not captured, per the note below - use it to test
Layout / Hide Sponsored By / Share Buttons behaviour post-submission.

Why hand-built instead of captured (see previews/petition.html for the
capture method used for the pre-submission form): getting the real
post-signature DOM requires actually completing a signature. Attempting
that from an automated browser tripped Action Network's own anti-bot
challenge script (challenge.min.js) - the verification request came back
as a network error and the signature never went through. That's the
anti-bot system correctly doing its job against a scripted browser; this
file does not attempt to bypass it. If you ever get a real capture (e.g.
by manually signing a real test action from a normal browser session and
saving the resulting page), replace this file the same way petition.html
would be re-captured (see README.md).

Structure is inferred from wrapper.html's own CSS/JS, which already
documents the expected shape:
- #can_embed_form gets class "can_thank_you_wrap" added (same element,
  not a new wrapper) - wrapper.html's CSS (~216-217) cards it the same way
  #can_sidebar is carded elsewhere.
- A #can_thank_you node is injected inside it - wrapper.html's share-button
  module (~878-885) looks for #can_thank_you first, falling back to
  #can_embed_form.can_thank_you_wrap, and appends the share-buttons row as
  the LAST child of whichever it finds.
- #action_info (sponsor box) can appear inside #can_thank_you too -
  wrapper.html's hideSponsoredBy rule explicitly targets
  ".an-hide-sponsor #can_thank_you #action_info" (~319).
- ".can_thank_you-block" (wrapper.html ~444-449) is applied to #can_main_col
  here since wrapper.html's two-column flex CSS keys off it. wrapper.html
  also has a rule for "#referral_code_select_wrap" nested inside it
  (~450-452, sets width:100%) - that's AN's real "referral codes" feature
  (probably a <select>, given the name, letting a canvasser pick which
  outreach code to share under), but a PREVIOUS version of this file
  invented a fake "Your personal share link" text input to go with it,
  with no real evidence of what that element actually looks like. Removed -
  don't reintroduce content here that isn't backed by an actual capture.

Reuses the exact sponsor-box and logo markup already verified working in
previews/petition.html, so styling of those parts is proven, not guessed.

Cross-checked against https://actionnetwork.org/petitions/action-title-3/thankyou
(a real page, provided by the user) - but that's AN's DIRECT-HOSTED
thank-you page (ids ty_page/ty_head/ty_signup, plus an AN account-signup
upsell section), not the embedded widget's inline thank-you state this
fixture stands in for - same direct-page-vs-widget-embed mismatch already
documented for event.html/fundraiser.html. Still, it confirmed real,
usable facts, now reflected here: the heading is genuinely "Thanks for
your support." (not the invented "Thank you for signing!" this file had
before), the body copy is a plain Lorem-ipsum placeholder (matching every
other example action already captured), and it has no signature-count
sidebar and no referral-link widget either - consistent with both being
removed above.

No #can_sidebar on this page - the signature-count/progress-bar tracker is
a call-to-action for people who haven't signed yet, not something you'd
show the person who just signed. #can_main_col gets an explicit
style="width:100%" since wrapper.html's two-column CSS otherwise leaves it
at its normal 56% (sized for when a sidebar is present), which would leave
a dead gap with nothing there to fill the other 44%.
-->
