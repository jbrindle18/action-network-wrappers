<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en-US">
<head>

  <!-- =======================================================================
       ACTION NETWORK PAGE WRAPPER - self-contained, generated by a tool
       =======================================================================

       >>> TO CHANGE THE BRANDING, YOU DON'T NEED TO EDIT THIS CODE. <<<
       Go to the free Solidarity Studio tool, change colours / fonts / logo /
       layout with simple controls, and copy the result back into Action Network:

           https://www.solidaritystudio.uk/tools/action-network-wrapper

       To edit an EXISTING wrapper: open the tool, click "Import Saved Wrapper",
       choose the wrapper.html you saved, make your changes, then use "Copy Header"
       / "Copy Footer" (or "Save Wrapper" to keep a fresh copy for next time).

       -----------------------------------------------------------------------
       HOW IT'S INSTALLED IN ACTION NETWORK
       Paste this whole file into an AN page-wrapper template (Details → Page
       Wrappers → Add New Wrapper). AN injects the action widget at the
       END-TEMPLATE-HEADER / START-WIDGET marker further down this file, so
       everything before it goes in the Header field and everything after in the
       Footer field - the tool's Copy Header / Copy Footer buttons split it for
       you (do not duplicate that marker text up here). All styles are
       inline in the <style id="anw-embed-css"> block below - no external CSS to
       upload or cache-bust. The only asset you upload is the logo image. The
       widget embed must use  ?format=js&style=full&css=whitelabel  so AN ships
       only a minimal structural base; the styles below paint on top.

       -----------------------------------------------------------------------
       ADVANCED (editing by hand) - search for the word  CONFIG :
         1. CONFIG: COLOURS+FONTS - edit the tokens at the top of the <style>
                                    block (Section 0), and the font <link>.
         2. CONFIG: LOGO          - set the logo <img> src + alt + home link.
         3. CONFIG: MODULES       - toggle optional behaviours (window.ANW).
         4. CONFIG: LAYOUT        - pick the .gen_wrapper layout-- class.
         5. CONFIG: DAISY CHAIN   - the thank-you page's text, buttons and
                                    routing (far easier to build in the tool).
       Note: if you edit this file by hand, the hosted tool won't reflect your
       change until its baked-in copy is refreshed (see README → "Re-baking").
       ======================================================================= -->

  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

  <!-- CONFIG: LOGO - favicon (optional) -->
  <link rel="icon" href="https://example.org/favicon.ico" />

  <!-- Preconnect to origins we'll need - saves a round-trip on first request -->
  <link rel="preconnect" href="https://actionnetwork.org">
  <link rel="preconnect" href="https://can2-prod.s3.amazonaws.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- CONFIG: FONTS - loaded async (media=print swap) so it doesn't block render.
       Request only the weights you use. Keep family in sync with --font-* tokens. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700;900&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700;900&display=swap"></noscript>

  <!-- =======================================================================
       BRAND STYLES (inline). Edit Section 0 tokens to re-theme.
       ======================================================================= -->
  <style id="anw-embed-css" type="text/css">

  /* 0. THEME TOKENS - CONFIG: COLOURS+FONTS. The only part you normally edit. */
  .an-homepage-embed {
    /* FONTS - must match the font <link> above */
    --font-body:        "DM Sans", sans-serif;
    --font-heading:     "DM Sans", sans-serif;
    --heading-weight:   900;
    --heading-transform: none;          /* uppercase | none */
    --button-transform: uppercase;      /* button text only */

    /* COLOURS - simplified to the handful that actually carry the brand.
       Everything else is either fixed (loading skeleton, shadow, etc) or
       computed FROM these via color-mix() - see the DERIVED block below. */
    --body:             #000000;   /* body text AND headings */
    --accent:           #2f4392;   /* entry-title heading, progress bar + total, links, required-field mark, input focus outline */
    --button-bg:        #42fffc;   /* action / submit button background */
    --button-text:      #000000;   /* action / submit button text */
    --input-border:     #000000;   /* input field border */

    --page-bg:          #fafeff;
    --header-bg:        #2f4392;
    --footer-bg:        #2f4392;
    --footer-text:      #ffffff;
    --card-bg:          #ffffff;   /* the form's own card ("Form colour") */

    /* SHAPE / SIZING */
    --card-radius:      8px;
    --statement-radius: 2px;
    --button-radius:    2px;
    --input-radius:     0;
    --input-height:     50px;
    --wrapper-max:      1200px;
    --fundraiser-max:   850px;     /* fundraisers only, when the sidebar is stacked or hidden */

    /* LOGO sizing */
    --logo-max-height:  40px;
    --logo-max-width:   180px;
  }

  /* 0b. DERIVED / STANDARD - computed from the tokens above via color-mix(),
     or fixed brand-neutral values (loading skeleton, shadow). Declared in a
     SEPARATE rule from Section 0 above so the tool's token parser (which
     only reads the FIRST .an-homepage-embed block) doesn't expose these as
     individually-editable fields - they follow the 10 tokens above
     automatically and aren't meant to be set directly. */
  .an-homepage-embed {
    --button-bg-hover:  color-mix(in srgb, var(--button-bg) 82%, black);
    --divider:          color-mix(in srgb, var(--accent) 25%, white);
    --card-border:      #e0e0e0;   /* fixed neutral - doesn't follow Accent */
    --statement-bar:    var(--accent);
    --statement-bg:     color-mix(in srgb, var(--accent) 6%, white);

    --graytext:         #767676;   /* "Target:" + other AN .graytext helper text */
    --placeholder:      #6b7280;
    --input-bg:         #ffffff;
    --skeleton:         #ebebeb;
    --card-shadow:      0 30px 60px -15px #232f4a14;
    --hover-opacity:    .85;
  }

  /* CONFIG: FONT-FACE - self-hosted / non-Google fonts.
     Add one @font-face per weight (and per family), then set --font-body /
     --font-heading above to the family name. Because this whole <style> block is
     also injected into AN's donation iframe, fonts declared here load there too -
     no <link> needed. Use this INSTEAD of the Google Fonts <link> in the head
     (clear the "Google Fonts URL" in the tool when you use custom fonts).
     Example with multiple fonts / weights:
       @font-face{font-family:"Aktiv Grotesk";src:url("https://YOURHOST/aktiv-400.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
       @font-face{font-family:"Aktiv Grotesk";src:url("https://YOURHOST/aktiv-700.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
       @font-face{font-family:"Tiempos Text";src:url("https://YOURHOST/tiempos-400.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap} */
  /* @font-face:start */
  /* @font-face:end */

  /* 1. BASE */
  .an-homepage-embed {
    font-family: var(--font-body);
    color: var(--body);
    background-color: var(--page-bg);
  }
  /* The full-bleed footer (Section 16) uses 100vw, which counts the
     scrollbar's width - without this, that overshoot forces a permanent
     horizontal scrollbar on pages tall enough to show one. */
  body.gen_body.an-homepage-embed { margin: 0; color: var(--body); overflow-x: hidden; }
  body.an-homepage-embed:not(.gen_body) { background-color: var(--card-bg) !important; margin: 0; }

  .an-homepage-embed h1,
  .an-homepage-embed h2,
  .an-homepage-embed h3,
  .an-homepage-embed h4,
  .an-homepage-embed h5,
  .an-homepage-embed #can_embed_form h2,
  .an-homepage-embed #donate_auto_modal h2,
  .an-homepage-embed #donate_make_recurring_modal h2 {
    font-family: var(--font-heading);
    font-weight: var(--heading-weight);
    text-transform: var(--heading-transform);
    color: var(--body);
    /* Without an explicit line-height here, headings inherit a flat 24px
       from #can_embed_form's own line-height rule below regardless of
       their actual font-size - too tight for anything bigger than ~20px.
       A unitless ratio scales correctly with whatever size each heading is. */
    line-height: 1.3;
  }
  .an-homepage-embed #can_embed_form,
  .an-homepage-embed #donate_auto_modal,
  .an-homepage-embed #donate_make_recurring_modal { line-height: 24px; }

  /* AN sets an explicit font-size directly on paragraphs, quote boxes and
     form fields (see Sections 5 and 8) that otherwise beats a themed base
     font-size on specificity, silently freezing body copy - inherit instead
     of leaving it to AN's hardcoded value. No visual change at the default
     16px; only matters once you resize body text. */
  .an-homepage-embed #can_embed_form p { font-size: inherit; }
  /* Some fonts' "bold" keyword resolves to a much heavier weight than 700
     (e.g. some variable fonts jump straight to 900) - pin inline emphasis to
     a normal bold regardless. Headings use --heading-weight deliberately. */
  .an-homepage-embed #can_embed_form strong,
  .an-homepage-embed #can_embed_form b { font-weight: 700; }

  /* 2. HEADER - CONFIG: LOGO sizing via tokens */
  .an-homepage-embed #gen_header {
    padding: 4px 0;
    background-color: var(--header-bg);
    border-bottom: 1px solid #0000000f;
  }
  .an-homepage-embed #gen_header .gen_wrapper {
    padding-top: 8px; padding-bottom: 8px;
    display: flex; align-items: center;
  }
  .an-homepage-embed #gen_header img {
    max-height: var(--logo-max-height);
    max-width: var(--logo-max-width);
    width: auto; height: auto;
  }
  .an-homepage-embed .gen_name { margin: 0; color: var(--body); }

  /* 3. PAGE WRAPPER */
  .an-homepage-embed .gen_wrapper {
    padding: 48px 24px;
    width: var(--wrapper-max);
    max-width: 100%;
    margin: auto;
    box-sizing: border-box;
  }

  /* 3b. FUNDRAISER WIDTH - with the description sidebar stacked or hidden
     the donation form is one column, so fundraisers use --fundraiser-max
     instead of --wrapper-max. Content area only - the header keeps the
     normal width. Body classes come from the shared helpers script. */
  .an-homepage-embed.anw-type-fundraiser.anw-fundraiser-narrow .gen_wrapper[class*="layout--"] {
    width: var(--fundraiser-max);
  }

  /* 4. COLUMNS - description plain, form on a white card */
  .an-homepage-embed .gen_wrapper #can_embed_form > .clearfix #can_main_col,
  .an-homepage-embed .can_embed #can_embed_form > .clearfix #can_main_col {
    background: transparent; padding: 0; box-sizing: border-box;
  }
  .an-homepage-embed .gen_wrapper #can_embed_form > .clearfix #can_sidebar,
  .an-homepage-embed .can_embed #can_embed_form > .clearfix #can_sidebar,
  .an-homepage-embed .gen_wrapper .survey_int,
  .an-homepage-embed .gen_wrapper #can_embed_form.can_thank_you_wrap,
  .an-homepage-embed .can_embed #can_embed_form.can_thank_you_wrap {
    background-color: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--card-radius);
    box-shadow: var(--card-shadow);
    padding: 33px;
    box-sizing: border-box;
  }
  .an-homepage-embed .gen_wrapper [id^="can-fundraising-area"] {
    background-color: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--card-radius);
    box-shadow: var(--card-shadow);
    overflow: hidden;
  }

  /* 4a. FUNDRAISER - the whole widget (main col + sidebar together) renders
     inside ONE iframe inside the [id^="can-fundraising-area"] mount div
     above, which already gets the card border/shadow. #can_sidebar picking
     up the same card treatment from rule 4 above (it matches
     .can_embed #can_embed_form > .clearfix #can_sidebar just as much on a
     fundraiser as elsewhere) doubles it up - a bordered, shadowed box nested
     inside another one. Cancel the border/shadow here specifically; keep the
     background + padding so it doesn't look cramped against the card edge. */
  .an-homepage-embed.can_fundraising_widget #can_embed_form > .clearfix #can_sidebar {
    border: none;
    box-shadow: none;
  }

  /* 4b. FUNDRAISER sidebar-hide [MODULE - enable via ANW.hideFundraiserSidebar].
     Needs the iframe injector: it adds .an-hide-sidebar to the iframe <body>. */
  .an-homepage-embed.can_fundraising_widget.an-hide-sidebar #can_sidebar { display: none !important; }
  .an-homepage-embed.can_fundraising_widget.an-hide-sidebar #can_main_col { width: 100% !important; }

  /* 4b2. FUNDRAISER sidebar-stack [MODULE - enable via ANW.stackFundraiserSidebar].
     AN splits the donation widget into two columns: #can_main_col (title +
     form) and #can_sidebar (amount raised + description). display:contents
     dissolves both column boxes, so their children become items of one
     flex column that `order` can interleave: amount raised, title,
     description, form. Anything else in either column keeps its place at
     the end. Needs the iframe injector: it adds .an-stack-sidebar. */
  .an-homepage-embed.can_fundraising_widget.an-stack-sidebar #can_embed_form > .clearfix {
    display: flex !important; flex-direction: column !important; flex-wrap: nowrap !important; gap: 0 !important;
  }
  .an-homepage-embed.can_fundraising_widget.an-stack-sidebar #can_main_col,
  .an-homepage-embed.can_fundraising_widget.an-stack-sidebar #can_sidebar { display: contents !important; }
  .an-homepage-embed.can_fundraising_widget.an-stack-sidebar #can_main_col > *,
  .an-homepage-embed.can_fundraising_widget.an-stack-sidebar #can_sidebar > * { order: 5; }
  .an-homepage-embed.can_fundraising_widget.an-stack-sidebar #can_sidebar > .action_status_tracker { order: 1; margin-bottom: 24px; width: 100% !important; }
  .an-homepage-embed.can_fundraising_widget.an-stack-sidebar #can_main_col > .entry-title { order: 2; }
  .an-homepage-embed.can_fundraising_widget.an-stack-sidebar #can_sidebar > .action_sidebar { order: 3; margin-bottom: 24px; width: 100% !important; }
  .an-homepage-embed.can_fundraising_widget.an-stack-sidebar #can_main_col > form { order: 4; }
  /* 4b3. FUNDRAISER "Contributions will go to" [MODULE - ANW.hideDonationRecipient].
     Needs the iframe injector: it adds .an-hide-recipient. */
  .an-homepage-embed.can_fundraising_widget.an-hide-recipient #donation_recipient_wrap { display: none !important; }
  /* Hide wins if both are on (this beats the display:contents above). */
  .an-homepage-embed.can_fundraising_widget.an-stack-sidebar.an-hide-sidebar #can_sidebar { display: none !important; }

  /* 4c. IFRAME CONTEXT - inset the form inside the donation / event widget.
     No outer card there (iframe <body> has .an-homepage-embed but NOT .gen_body),
     so without this the form runs flush to the iframe edges. Pad #can_embed_form
     itself (not its inner .clearfix): the fundraiser nests .clearfix directly,
     but ticketed events nest it one level deeper (#can_embed_form > div >
     .clearfix), so a > .clearfix rule misses them. #can_embed_form is the
     outermost wrapper in both, so padding it covers all sides in both layouts. */
  .an-homepage-embed:not(.gen_body) #can_embed_form {
    padding: 24px; box-sizing: border-box;
  }

  /* 5. QUOTE BOX (blockquote/q) + plain sidebar form heading.
     The grey box is for actual quotes only - the "Sign This Petition" heading
     (#can_sidebar .action_sidebar h4) must stay a plain heading. */
  .an-homepage-embed #can_embed_form blockquote,
  .an-homepage-embed #can_embed_form q {
    background: var(--statement-bg);
    border-left: 4px solid var(--statement-bar);
    border-radius: var(--statement-radius);
    padding: 16px 16px 16px 20px;
    margin: 0 0 24px;
    text-transform: none !important;
    font-weight: 400;
    font-size: inherit;
    line-height: 24px;
  }
  .an-homepage-embed #can_embed_form blockquote::before,
  .an-homepage-embed #can_embed_form q::before { display: none !important; }
  /* 5b. LETTER TO TARGET ("action_letter") - AN doesn't wrap this in an
     actual blockquote/q, so it gets none of the quote-box theming above by
     default; give it the same accent-bar treatment explicitly. AN also
     renders a decorative ::before "folded corner" strip on this box,
     independent of the border property - hide it, or it shows through as
     a second, conflicting border once ours is coloured. */
  .an-homepage-embed #can_embed_form .action_letter {
    background: var(--card-bg);
    border-left: 4px solid var(--accent);
  }
  .an-homepage-embed #can_embed_form .action_letter::before { display: none !important; }
  .an-homepage-embed #can_embed_form #can_sidebar .action_sidebar > h4,
  .an-homepage-embed #can_embed_form #can_sidebar > h4 {
    background: none; border: 0; border-radius: 0; padding: 0;
    margin: 0 0 16px; font-size: 22px; line-height: 1.2;
    text-transform: var(--heading-transform);
  }
  /* Kill whitelabel's decorative 1px underline bar under the heading. */
  .an-homepage-embed #can_embed_form #can_sidebar .action_sidebar > h4::after,
  .an-homepage-embed #can_embed_form #can_sidebar > h4::after { display: none !important; }

  /* 6. ENTRY TITLE */
  .an-homepage-embed #can_embed_form h2.entry-title,
  .an-homepage-embed #can_embed_form h1.entry-title {
    font-size: 32px;
    line-height: 1.2;
    margin-bottom: 16px !important;
    border-bottom: none !important;
    padding-bottom: 0 !important;
    color: var(--accent);
  }
  /* On the thank-you page, AN's whitelabel CSS centers the surrounding
     #can_thank_you content, but its own .entry-title base style stays
     left-aligned (correct for its usual spot above a two-column form) -
     the two fight. Re-center just here so the branded title (still using
     .entry-title for the accent-colour/size treatment above) doesn't sit
     oddly left-aligned above centered thank-you copy. */
  .an-homepage-embed #can_embed_form.can_thank_you_wrap h2.entry-title,
  .an-homepage-embed #can_embed_form.can_thank_you_wrap h1.entry-title {
    text-align: center;
  }
  .an-homepage-embed #can_embed_form .main_action_image { margin-bottom: 16px !important; }

  /* 7. HIDE "SPONSORED BY" / "PETITION BY" [MODULE - on by default via the
     an-hide-sponsor body class; ANW.hideSponsoredBy:false removes the class].
     Incl. the thank-you variant (#can_thank_you #action_info .action_info_user
     has no .action_owner_box). */
  .an-homepage-embed.an-hide-sponsor #action_info_inner,
  .an-homepage-embed.an-hide-sponsor .action_owner_box,
  .an-homepage-embed.an-hide-sponsor .sponsor_owner_box,
  .an-homepage-embed.an-hide-sponsor #can_thank_you #action_info { display: none !important; }

  /* 8. FORM FIELDS */
  .an-homepage-embed #can_embed_form label {
    font-weight: 700; color: var(--body);
    font-size: 16px; line-height: 24px; margin-bottom: 4px; display: inline-block;
  }
  .an-homepage-embed #can_embed_form label .required,
  .an-homepage-embed #can_embed_form .required { color: var(--accent); }
  /* Each field also ships a second, empty label that AN's floatlabel JS
     empties once it builds the visible floating label (Section 8b below).
     It has no text, but a label rule's line-height still gives it an
     invisible "phantom" line box that inflates the row's height - hide it. */
  .an-homepage-embed #can_embed_form label.control-label.disabled { display: none; }

  .an-homepage-embed #can_embed_form input[type="text"],
  .an-homepage-embed #can_embed_form input[type="password"],
  .an-homepage-embed #can_embed_form input[type="url"],
  .an-homepage-embed #can_embed_form input[type="email"],
  .an-homepage-embed #can_embed_form input[type="tel"],
  .an-homepage-embed #can_embed_form input[type="number"],
  .an-homepage-embed #can_embed_form select.can_select,
  .an-homepage-embed #can_embed_form span.can_select {
    height: var(--input-height);
    line-height: normal;
    font-size: inherit;
    border: 1px solid var(--input-border);
    background-color: var(--input-bg);
    border-radius: var(--input-radius);
    padding: 0 13px;
    box-sizing: border-box;
  }
  /* span.can_select shows the selected value as text - needs an explicit
     line-height to vertically centre it (e.g. country picker "United Kingdom"). */
  .an-homepage-embed #can_embed_form span.can_select {
    line-height: calc(var(--input-height) - 2px);
    padding-right: 30px;
  }
  .an-homepage-embed #can_embed_form textarea {
    border: 1px solid var(--input-border);
    background-color: var(--input-bg);
    border-radius: var(--input-radius);
    padding: 13px;
    box-sizing: border-box;
  }
  /* 8b. FLOATING LABELS - AN's floatlabel widget (used on some field types)
     floats its label up over the input's top border on focus/fill. Its
     background is transparent by default, so --input-border cuts straight
     through the label text; give it an opaque backing so it masks the
     border cleanly, like a notched outline. */
  .an-homepage-embed #can_embed_form .floatlabel-label {
    background-color: var(--input-bg);
  }
  .an-homepage-embed #can_embed_form input[type="text"]:focus,
  .an-homepage-embed #can_embed_form input[type="password"]:focus,
  .an-homepage-embed #can_embed_form input[type="url"]:focus,
  .an-homepage-embed #can_embed_form input[type="email"]:focus,
  .an-homepage-embed #can_embed_form input[type="tel"]:focus,
  .an-homepage-embed #can_embed_form input[type="number"]:focus,
  .an-homepage-embed #can_embed_form textarea:focus { border-color: var(--accent); }

  .an-homepage-embed #can_embed_form input::placeholder,
  .an-homepage-embed #can_embed_form textarea::placeholder { color: var(--placeholder); opacity: 1; }

  .an-homepage-embed #can_embed_form .can_form .section_header,
  .an-homepage-embed #can_embed_form #email_wrap,
  .an-homepage-embed #can_embed_form #phone_wrap {
    border-top: 1px solid var(--divider);
    padding-top: 12px;
  }
  .an-homepage-embed #can_embed_form .can_field_description,
  .an-homepage-embed #can_embed_form .form_caption,
  .an-homepage-embed #can_embed_form .disclaimer {
    font-size: 12px; line-height: 18px; color: var(--body);
  }

  /* 9. SUBMIT BUTTON */
  .an-homepage-embed #can_embed_form input[type="submit"],
  .an-homepage-embed #can_embed_form .button,
  .an-homepage-embed #donate_auto_modal input[type="submit"],
  .an-homepage-embed #donate_auto_modal .button {
    background-color: var(--button-bg);
    color: var(--button-text);
    border-radius: var(--button-radius);
    font-size: 20px; font-weight: 700;
    text-transform: var(--button-transform);
    letter-spacing: .6px;
    padding: 16px 20px;
    line-height: 1.2;
  }
  .an-homepage-embed #can_embed_form input[type="submit"]:hover,
  .an-homepage-embed #can_embed_form .button:hover,
  .an-homepage-embed #donate_auto_modal input[type="submit"]:hover,
  .an-homepage-embed #donate_auto_modal .button:hover { background-color: var(--button-bg-hover); color: var(--button-text); }

  /* 9b. DONATION AMOUNTS (fundraisers) - the suggested amounts look like the
     submit button; the selected one (AN adds .donate_amount-selected) is the
     inverse. Beats AN's own green hover/selected rule on specificity. */
  .an-homepage-embed #can_embed_form label.donate_amount {
    background-color: var(--button-bg); color: var(--button-text);
    border: 2px solid var(--button-bg); border-radius: var(--button-radius);
    font-weight: 700; text-transform: var(--button-transform);
    /* AN centres the text with a 56px line-height on a 56px box; our 2px
       border eats 4px of that, which sat the text 2px low. */
    height: 56px; line-height: 52px; box-sizing: border-box;
  }
  .an-homepage-embed #can_embed_form label.donate_amount:hover {
    background-color: var(--button-bg-hover); border-color: var(--button-bg-hover); color: var(--button-text);
  }
  .an-homepage-embed #can_embed_form label.donate_amount-selected,
  .an-homepage-embed #can_embed_form label.donate_amount-selected:hover {
    background-color: var(--button-text); color: var(--button-bg); border-color: var(--button-bg);
  }
  /* "Other" amount: show the currency symbol in front of a typed number. The
     iframe injector copies the symbol from AN's own "£ Other" placeholder onto
     the label, so it follows the group's currency. */
  .an-homepage-embed #can_embed_form label.other_label[data-anw-currency] { position: relative; }
  .an-homepage-embed #can_embed_form label.other_label[data-anw-currency]:has(.other_input:not(:placeholder-shown))::after {
    content: attr(data-anw-currency);
    position: absolute; top: 50%; left: var(--anw-currency-left, 14px); transform: translateY(-50%);
    color: var(--body); font-weight: 400; font-size: 16px; pointer-events: none;
  }
  .an-homepage-embed #can_embed_form label.other_label[data-anw-currency] .other_input:not(:placeholder-shown) {
    padding-left: calc(var(--anw-currency-pad, 13px) + 1em) !important;
  }

  /* 9c. DONATION FORM FIELDS (fundraisers) - AN floats these at half /
     quarter / third widths, which wraps unevenly and leaves ragged gaps. A
     12-column grid gives clean rows with even spacing:
       first name | last name,  email | address,
       city | country | postcode,  card number | expiry | security code.
     Anything else (button, errors, opt-ins) spans the full width; on narrow
     screens the halves and thirds stack. AN's styled dropdowns are a hidden
     native <select> laid over a <span class="can_select"> with inline pixel
     widths - both are stretched to fill their cell. */
  .an-homepage-embed #can_embed_form #donate_form > ul {
    display: grid !important; grid-template-columns: repeat(12, minmax(0, 1fr));
    column-gap: 12px; row-gap: 0; margin: 0 !important; padding: 0 !important; list-style: none;
  }
  .an-homepage-embed #can_embed_form #donate_form > ul::before,
  .an-homepage-embed #can_embed_form #donate_form > ul::after { display: none !important; }   /* clearfix pseudos would become grid cells */
  /* Every child, not just <li>: on live pages AN also puts divs in this
     list (#donate_login, .additional_text, scripts) - left unplaced they
     each squeeze into one 1/12 column. */
  .an-homepage-embed #can_embed_form #donate_form > ul > * {
    grid-column: 1 / -1; float: none !important; clear: none !important;
    width: auto !important; min-width: 0; margin: 0 0 12px !important; padding: 0 !important;
  }
  .an-homepage-embed #can_embed_form #donate_form > ul > li:not(:has(*)) { margin: 0 !important; }
  .an-homepage-embed #can_embed_form #donate_form > ul > #donate_login { font-size: 14px; }   /* empty placeholders */
  .an-homepage-embed #can_embed_form #donate_form > ul > li.cc_li_half    { grid-column: span 6; }
  .an-homepage-embed #can_embed_form #donate_form > ul > li.cc_li_quarter { grid-column: span 3; }
  .an-homepage-embed #can_embed_form #donate_form > ul > li.cc_li_third   { grid-column: span 4; }
  .an-homepage-embed #can_embed_form #donate_form > ul > li:has(.donate_cc_month) { display: flex; gap: 12px; }
  .an-homepage-embed #can_embed_form #donate_form > ul .donate_cc_month,
  .an-homepage-embed #can_embed_form #donate_form > ul .donate_cc_year { position: relative; flex: 1 1 0; min-width: 0; }
  .an-homepage-embed #can_embed_form #donate_form > ul .floatlabel-wrapper,
  .an-homepage-embed #can_embed_form #donate_form > ul input[type="text"],
  .an-homepage-embed #can_embed_form #donate_form > ul input[type="email"],
  .an-homepage-embed #can_embed_form #donate_form > ul input[type="tel"] { width: 100% !important; margin-bottom: 0 !important; }   /* the grid does the spacing */
  .an-homepage-embed #can_embed_form #donate_form > ul select.hasCustomSelect { width: 100% !important; left: 0; margin-bottom: 0 !important; }
  .an-homepage-embed #can_embed_form #donate_form > ul span.can_select { display: block !important; width: 100% !important; margin-bottom: 0 !important; }
  .an-homepage-embed #can_embed_form #donate_form > ul span.can_selectInner { width: auto !important; }
  /* Breakpoints follow the FORM's width, not the screen's (container
     queries): in the side-by-side layout the form column is narrow even on
     a desktop. Medium: city full width, country | postcode, card full width,
     expiry | security code. Narrow: one field per row (country | postcode
     and the expiry pair stay paired). */
  .an-homepage-embed #can_embed_form #donate_form { container-type: inline-size; }
  @container (max-width: 560px) {
    .an-homepage-embed #can_embed_form #donate_form > ul > li.cc_li_half.clear,
    .an-homepage-embed #can_embed_form #donate_form > ul > li.cc_li_third.clear { grid-column: 1 / -1; }
    .an-homepage-embed #can_embed_form #donate_form > ul > li.cc_li_quarter,
    .an-homepage-embed #can_embed_form #donate_form > ul > li.cc_li_third { grid-column: span 6; }
  }
  @container (max-width: 380px) {
    .an-homepage-embed #can_embed_form #donate_form > ul > li.cc_li_half,
    .an-homepage-embed #can_embed_form #donate_form > ul > li.cc_li_third { grid-column: 1 / -1; }
  }

  /* 9d. TICK BOXES + RADIOS - the browser's default 13px controls ignore the
     theme, so they're drawn here: a square (checkbox) or circle (radio) in
     the input-border colour that fills with --accent when chosen - a tick
     or a dot in the input background colour - plus a focus ring for
     keyboard users. The radios AN keeps invisible behind its own buttons
     (donation amounts, tip jar) are left alone. Option labels (opt-in
     Yes / No) get room for the larger control, aligned to the first line. */
  .an-homepage-embed #can_embed_form input[type="checkbox"]:not(label.donate_amount *):not(label.tip_label *),
  .an-homepage-embed #can_embed_form input[type="radio"]:not(label.donate_amount *):not(label.tip_label *) {
    -webkit-appearance: none; appearance: none; box-sizing: border-box;
    /* !important: AN's "#can_embed_form #d_sharing input" (two ids) sets
       width / height auto and display inline-block on the opt-in radios. */
    width: 20px !important; height: 20px !important; margin: 0 8px 0 0; padding: 0; flex: 0 0 auto;
    display: inline-grid !important; place-content: center; vertical-align: -4px; cursor: pointer;
    border: 2px solid var(--input-border); border-radius: 3px; background-color: var(--input-bg);
    transition: background-color .15s ease, border-color .15s ease;
  }
  .an-homepage-embed #can_embed_form input[type="radio"]:not(label.donate_amount *):not(label.tip_label *) { border-radius: 50%; }
  .an-homepage-embed #can_embed_form input[type="checkbox"]:not(label.donate_amount *):not(label.tip_label *)::before,
  .an-homepage-embed #can_embed_form input[type="radio"]:not(label.donate_amount *):not(label.tip_label *)::before {
    content: ""; transform: scale(0); transition: transform .12s ease;
  }
  .an-homepage-embed #can_embed_form input[type="checkbox"]:not(label.donate_amount *):not(label.tip_label *)::before {
    width: 12px; height: 12px; background: var(--input-bg);
    clip-path: polygon(14% 52%, 0 66%, 38% 100%, 100% 22%, 86% 8%, 38% 72%);   /* tick */
  }
  .an-homepage-embed #can_embed_form input[type="radio"]:not(label.donate_amount *):not(label.tip_label *)::before {
    width: 10px; height: 10px; border-radius: 50%; background: var(--accent);
  }
  .an-homepage-embed #can_embed_form input[type="checkbox"]:not(label.donate_amount *):not(label.tip_label *):checked {
    background-color: var(--accent); border-color: var(--accent);
  }
  .an-homepage-embed #can_embed_form input[type="radio"]:not(label.donate_amount *):not(label.tip_label *):checked { border-color: var(--accent); }
  .an-homepage-embed #can_embed_form input[type="checkbox"]:not(label.donate_amount *):not(label.tip_label *):checked::before,
  .an-homepage-embed #can_embed_form input[type="radio"]:not(label.donate_amount *):not(label.tip_label *):checked::before { transform: scale(1); }
  .an-homepage-embed #can_embed_form input[type="checkbox"]:focus-visible,
  .an-homepage-embed #can_embed_form input[type="radio"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* AN positions option inputs absolutely at the label's top-left, with a
     25px text indent sized for its 13px control. */
  .an-homepage-embed #can_embed_form .check_radio_field label:not(.donate_amount):not(.tip_label) {   /* not the amount buttons - same wrapper class */
    padding-top: 0 !important; padding-left: 32px !important;
  }
  .an-homepage-embed #can_embed_form .check_radio_field label > input[type="radio"]:not(label.donate_amount *),
  .an-homepage-embed #can_embed_form .check_radio_field label > input[type="checkbox"] {
    position: absolute !important; left: 0 !important; top: 2px !important; margin: 0;   /* beats the same #d_sharing rule */
  }

  /* 10. LINKS */
  .an-homepage-embed a { color: var(--accent); text-decoration: underline; }
  .an-homepage-embed a:hover { color: var(--accent); opacity: var(--hover-opacity); text-decoration: underline; }

  /* 11. PROGRESS BAR */
  .an-homepage-embed .action_status_tracker { text-align: center; margin-bottom: 12px; }
  .an-homepage-embed .action_status_running_total {
    font-family: var(--font-heading); font-size: 1em; font-weight: 700 !important;
    color: var(--accent) !important; margin-bottom: 6px;
  }
  .an-homepage-embed .action_status_status_bar {
    display: block; width: 100%; height: 10px; border-radius: 5px;
    background: #e0e0e0; overflow: hidden; margin: 0 0 6px;
  }
  .an-homepage-embed #can_embed_form .action-widget--toggle .action_status_status_bar span.action_status_status_bar-grow {
    background: var(--accent) !important;
  }
  .an-homepage-embed .action_status_goal { font-size: 0.8em; color: var(--graytext); margin-bottom: 12px; }
  /* "Target: N signatures" and AN's other muted helper text. */
  .an-homepage-embed #can_embed_form .graytext { color: var(--graytext); }
  .an-homepage-embed #can_embed_form_inner.survey_int #survey_questions_footer button {
    height: auto !important; padding-top: 12px !important; padding-bottom: 12px !important;
  }

  /* 12. TWO-COLUMN LAYOUT */
  .an-homepage-embed .gen_wrapper.layout--reverse #can_embed_form > .clearfix,
  .an-homepage-embed .gen_wrapper.layout--equal  #can_embed_form > .clearfix,
  .an-homepage-embed .gen_wrapper.layout--full   #can_embed_form > .clearfix {
    align-items: flex-start; display: flex; flex-flow: row wrap; gap: 64px;
  }
  .an-homepage-embed .gen_wrapper.layout--reverse #can_embed_form > .clearfix .can_thank_you-block,
  .an-homepage-embed .gen_wrapper.layout--equal  #can_embed_form > .clearfix .can_thank_you-block,
  .an-homepage-embed .gen_wrapper.layout--full   #can_embed_form > .clearfix .can_thank_you-block,
  .an-homepage-embed .gen_wrapper.layout--reverse #can_embed_form.can_768 > .clearfix .can_thank_you-block,
  .an-homepage-embed .gen_wrapper.layout--equal  #can_embed_form.can_768 > .clearfix .can_thank_you-block,
  .an-homepage-embed .gen_wrapper.layout--full   #can_embed_form.can_768 > .clearfix .can_thank_you-block,
  .an-homepage-embed .gen_wrapper.layout--reverse #can_embed_form > .clearfix .can_thank_you-block #referral_code_select_wrap,
  .an-homepage-embed .gen_wrapper.layout--equal  #can_embed_form > .clearfix .can_thank_you-block #referral_code_select_wrap,
  .an-homepage-embed .gen_wrapper.layout--full   #can_embed_form > .clearfix .can_thank_you-block #referral_code_select_wrap { width: 100%; }
  .an-homepage-embed .gen_wrapper.layout--reverse #can_embed_form > .clearfix #can_main_col #action_info .action_owner_box {
    float: none; margin-right: 0; width: 100%;
  }
  .an-homepage-embed .gen_wrapper.layout--equal  #can_embed_form > .clearfix #can_sidebar,
  .an-homepage-embed .gen_wrapper.layout--reverse #can_embed_form > .clearfix #can_sidebar,
  .an-homepage-embed .gen_wrapper.layout--equal  #can_embed_form > .clearfix #can_main_col,
  .an-homepage-embed .gen_wrapper.layout--reverse #can_embed_form > .clearfix #can_main_col { width: 100%; margin-bottom: 0; }
  .an-homepage-embed .gen_wrapper.layout--reverse #can_embed_form > .clearfix #can_sidebar,
  .an-homepage-embed .gen_wrapper.layout--equal  #can_embed_form > .clearfix #can_sidebar,
  .an-homepage-embed .gen_wrapper.layout--full   #can_embed_form > .clearfix #can_sidebar { margin-left: auto; }

  @media (min-width: 768px) {
    .an-homepage-embed .gen_wrapper.layout--reverse #can_embed_form > .clearfix,
    .an-homepage-embed .gen_wrapper.layout--equal  #can_embed_form > .clearfix,
    .an-homepage-embed .gen_wrapper.layout--full   #can_embed_form > .clearfix { flex-flow: row nowrap; }
    .an-homepage-embed .gen_wrapper.layout--reverse #can_embed_form.can_thank_you_wrap > .clearfix,
    .an-homepage-embed .gen_wrapper.layout--equal  #can_embed_form.can_thank_you_wrap > .clearfix,
    .an-homepage-embed .gen_wrapper.layout--full   #can_embed_form.can_thank_you_wrap > .clearfix { flex-flow: row wrap; }
    .an-homepage-embed .gen_wrapper.layout--equal #can_embed_form > .clearfix #can_main_col { width: 56%; margin-bottom: 0; }
    .an-homepage-embed .gen_wrapper.layout--equal #can_embed_form > .clearfix #can_sidebar { width: 40%; }
    .an-homepage-embed .gen_wrapper.layout--reverse #can_embed_form > .clearfix #can_main_col { width: 30%; margin-bottom: 0; }
    .an-homepage-embed .gen_wrapper.layout--reverse #can_embed_form > .clearfix #can_sidebar { width: 65%; }
    .an-homepage-embed .gen_wrapper.layout--reverse #can_embed_form > .clearfix #can_letter_one_col #can_sidebar,
    .an-homepage-embed .gen_wrapper.layout--reverse #can_embed_form > .clearfix #can_letter_one_col #can_main_col,
    .an-homepage-embed .gen_wrapper.layout--equal  #can_embed_form > .clearfix #can_letter_one_col #can_sidebar,
    .an-homepage-embed .gen_wrapper.layout--equal  #can_embed_form > .clearfix #can_letter_one_col #can_main_col { width: 100%; }
  }

  .an-homepage-embed .gen_wrapper.layout--full #can_embed_form > .clearfix { flex-flow: row wrap; }
  .an-homepage-embed .gen_wrapper.layout--full #can_embed_form > .clearfix #can_sidebar,
  .an-homepage-embed .gen_wrapper.layout--full #can_embed_form > .clearfix #can_main_col { width: 100%; margin-bottom: 0; }

  .an-homepage-embed .gen_wrapper.layout--reverse .event_campaign #can_embed_form > .clearfix,
  .an-homepage-embed .gen_wrapper.layout--full   .event_campaign #can_embed_form > .clearfix,
  .an-homepage-embed .gen_wrapper.layout--equal  .event_campaign #can_embed_form > .clearfix { flex-flow: row wrap; }
  .an-homepage-embed .gen_wrapper.layout--reverse .event_campaign #can_embed_form > .clearfix .entry-title,
  .an-homepage-embed .gen_wrapper.layout--full   .event_campaign #can_embed_form > .clearfix .entry-title,
  .an-homepage-embed .gen_wrapper.layout--equal  .event_campaign #can_embed_form > .clearfix .entry-title { width: 100%; }
  .an-homepage-embed .gen_wrapper.layout--reverse .event_campaign #can_embed_form > .clearfix #can_sidebar,
  .an-homepage-embed .gen_wrapper.layout--full   .event_campaign #can_embed_form > .clearfix #can_sidebar,
  .an-homepage-embed .gen_wrapper.layout--equal  .event_campaign #can_embed_form > .clearfix #can_sidebar { order: 2; }

  /* Host-site embed context (.can_embed) */
  .an-homepage-embed .can_embed #can_embed_form > .clearfix,
  .an-homepage-embed .can_embed #can_embed_form > div > .clearfix {
    align-items: flex-start; display: flex; flex-flow: row wrap; gap: 64px;
  }
  .an-homepage-embed .can_embed #can_embed_form > .clearfix #can_sidebar,
  .an-homepage-embed .can_embed #can_embed_form > div > .clearfix #can_sidebar { margin-left: auto; width: 100%; }
  .an-homepage-embed .can_embed #can_embed_form > .clearfix #can_main_col,
  .an-homepage-embed .can_embed #can_embed_form > div > .clearfix #can_main_col { width: 100%; margin-bottom: 0; }
  @media (min-width: 768px) {
    .an-homepage-embed .can_embed #can_embed_form > .clearfix,
    .an-homepage-embed .can_embed #can_embed_form > div > .clearfix { flex-flow: row nowrap; }
    .an-homepage-embed .can_embed #can_embed_form > .clearfix #can_sidebar,
    .an-homepage-embed .can_embed #can_embed_form > div > .clearfix #can_sidebar { width: 40%; }
    .an-homepage-embed .can_embed #can_embed_form > .clearfix #can_main_col,
    .an-homepage-embed .can_embed #can_embed_form > div > .clearfix #can_main_col { width: 56%; margin-bottom: 0; }
  }

  /* Basic embed wrapper (no layout-- / no can_embed) */
  .an-homepage-embed .gen_wrapper #can_embed_form > .clearfix {
    align-items: flex-start; display: flex; flex-flow: row wrap; gap: 64px;
  }
  .an-homepage-embed .gen_wrapper #can_embed_form > .clearfix #can_sidebar { margin-left: auto; width: 100%; }
  .an-homepage-embed .gen_wrapper #can_embed_form > .clearfix #can_main_col { width: 100%; margin-bottom: 0; }
  @media (min-width: 768px) {
    .an-homepage-embed .gen_wrapper #can_embed_form > .clearfix { flex-flow: row nowrap; }
    .an-homepage-embed .gen_wrapper #can_embed_form > .clearfix #can_sidebar { width: 40%; }
    .an-homepage-embed .gen_wrapper #can_embed_form > .clearfix #can_main_col { width: 56%; margin-bottom: 0; }
  }

  /* 13. CLEARFIX PSEUDO-ELEMENT FIX */
  .an-homepage-embed #can_embed_form > .clearfix::before,
  .an-homepage-embed #can_embed_form > .clearfix::after { display: none !important; }

  /* 14. HIDE "EMBED THIS ACTION" BLOCK */
  .an-homepage-embed .can_thank_you-block:has(.embed_textarea) { display: none !important; }

  /* 15. SURVEY */
  .an-homepage-embed .survey_int .control-label.check_radio_label { font-size: 16px; line-height: 24px; font-weight: 500; }
  /* AN reuses the same check_radio_label / radio classes for opt-in Yes/No
     questions (e.g. "would you like to receive email updates?") outside of
     .survey_int too - those aren't covered by the rule above, so they fall
     through to AN's own smaller default instead of following the theme.
     Use an explicit size (matching the other field labels in section 8)
     rather than 1em: the <ul>/<li> AN wraps this in has its own much
     smaller font-size (as low as 11px), and 1em just inherits that - it
     doesn't restore the theme's size, it compounds through it. */
  .an-homepage-embed #can_embed_form .control-label.check_radio_label,
  .an-homepage-embed #can_embed_form label.radio {
    font-size: 16px; line-height: 24px; font-weight: 500;
  }
  /* AN's whitelabel CSS has its own more specific rule just for the opt-in
     question wrapper (#d_sharing.affirmative_optin_d_sharing .check_radio_label,
     2 ids + 2 classes) that otherwise beats the rule above (1 id + 3 classes)
     regardless of stylesheet order, silently pinning it back to 14px. Match
     the same structure so this one wins on specificity too. */
  .an-homepage-embed #can_embed_form #d_sharing.affirmative_optin_d_sharing .control-label.check_radio_label {
    font-size: 16px; line-height: 24px; font-weight: 500;
  }

  /* 16. FOOTER - full-bleed (AN renders it inside the centred .gen_wrapper) */
  .an-homepage-embed #gen_footer {
    position: relative; left: 50%; right: 50%; width: 100vw;
    margin-top: 48px; margin-left: -50vw; margin-right: -50vw; box-sizing: border-box;
    background: var(--footer-bg); color: var(--footer-text);
    text-align: center; padding: 40px 24px; font-size: 13px; line-height: 20px;
  }
  /* Cancel .gen_wrapper bottom padding so there's no gap beneath the band. */
  .an-homepage-embed .gen_wrapper > #gen_footer { margin-bottom: -48px; }
  .an-homepage-embed #gen_footer a { color: var(--footer-text); text-decoration: underline; }

  /* 17. LOADING PLACEHOLDER */
  /* Reserve height so the footer doesn't ride up to the top while AN's form
     is still rendering (the loader is absolutely positioned, so without this
     the empty wrapper would collapse to just its padding). */
  .an-homepage-embed .gen_wrapper.layout--equal,
  .an-homepage-embed .gen_wrapper.layout--reverse,
  .an-homepage-embed .gen_wrapper.layout--full { position: relative; min-height: 450px; }
  #anw-loader {
    position: absolute; inset: 0; min-height: 450px; z-index: 10;
    background: var(--page-bg); margin: 0; pointer-events: none;
  }
  .anw-loader__pad {
    padding: 48px 24px 0; display: flex; justify-content: space-between;
    gap: 32px; width: 100%; box-sizing: border-box;
  }
  /* Left column - description, plain (no card), matches the 56% main column. */
  .anw-loader__desc { width: 56%; padding-top: 4px; box-sizing: border-box; }
  .anw-loader__card {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: var(--card-radius); box-shadow: var(--card-shadow);
    width: 40%; min-width: 320px; padding: 33px; box-sizing: border-box;
  }
  .anw-loader__line {
    background: var(--skeleton); border-radius: 4px; margin-bottom: 14px;
    animation: anw-pulse 1.4s ease-in-out infinite;
  }
  @keyframes anw-pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  @media (max-width: 767px) {
    .anw-loader__pad  { flex-direction: column; justify-content: flex-start; padding-top: 28px; gap: 24px; }
    .anw-loader__desc { width: 100%; }
    .anw-loader__card { width: 100%; min-width: 0; }
  }

  /* 18. MOBILE */
  @media (max-width: 767px) {
    .an-homepage-embed #can_embed_form h2.entry-title,
    .an-homepage-embed #can_embed_form h1.entry-title { font-size: 24px !important; line-height: 1.2 !important; }
    .an-homepage-embed .gen_wrapper { padding: 28px 16px; }
    .an-homepage-embed .gen_wrapper > #gen_footer { margin-bottom: -28px; }
    .an-homepage-embed .gen_wrapper.layout--reverse #can_embed_form > .clearfix,
    .an-homepage-embed .gen_wrapper.layout--equal  #can_embed_form > .clearfix,
    .an-homepage-embed .gen_wrapper.layout--full   #can_embed_form > .clearfix { gap: 24px; }
    .an-homepage-embed .gen_wrapper #can_embed_form > .clearfix #can_sidebar,
    .an-homepage-embed .can_embed #can_embed_form > .clearfix #can_sidebar { padding: 20px !important; }
  }

  /* 19. MOBILE "JUMP TO ACTION" BUTTON [MODULE - ANW.jumpToAction]. Floats at
     the bottom of the screen while the user scrolls through the intro content
     on mobile, where the description and the form stack vertically. Hidden
     once the form scrolls into view - see the module script below, which
     toggles the .is-visible class. Mobile-only by design: display stays none

  .an-homepage-embed .anw-jump {

                       (donations, ticketed events), so iframe work is skipped
                       on petitions, letters and forms.

                       of one per module; fn runs now and on every DOM change
                       until it returns true. */

  <script>
    /* Inject our inline styles (and the brand font) into the fundraiser iframe
       (same-origin) and tag its <body> so scoped rules apply. The donation
       widget renders in an iframe whose document is replaced once the widget
       loads, so we re-inject on its 'load' event. Reads the inline
       <style id="anw-embed-css"> textContent - single source, no URL. */
    (function () {
      'use strict';
      if (!window.ANW.hasIframes()) return;   // petitions, letters, forms - nothing to style
      var styleEl = document.getElementById('anw-embed-css');
      var CSS_TEXT = styleEl ? styleEl.textContent : '';

      /* Inject into one iframe's document. Idempotent: if our <style> is already
         present it just re-asserts the body classes and returns. Returns true
         once the doc is reachable and styled. AN replaces the iframe document
         after its widget JS runs, which removes our <style> - so when that
         happens getElementById() misses and we re-inject. */
      function injectIntoIframe(iframe) {
        try {
          var doc = iframe.contentDocument || iframe.contentWindow.document;
          if (!doc || !doc.head || !doc.body) return false;
          doc.body.classList.add('an-homepage-embed');
          if (window.ANW.hideFundraiserSidebar) doc.body.classList.add('an-hide-sidebar');
          if (window.ANW.stackFundraiserSidebar) doc.body.classList.add('an-stack-sidebar');
          if (window.ANW.hideDonationRecipient) doc.body.classList.add('an-hide-recipient');
          if (window.ANW.hideSponsoredBy !== false) doc.body.classList.add('an-hide-sponsor');
          /* Currency symbol for the "Other" amount (see CSS 9b): AN's
             placeholder is e.g. "£ Other", so take whatever comes before the
             word. Placed where the input's text starts. */
          var other = doc.querySelector('label.other_label');
          var oi = other && other.querySelector('input.other_input');
          if (oi && !other.hasAttribute('data-anw-currency')) {
            var sym = (oi.getAttribute('placeholder') || '').split(/\s+/)[0];
            if (sym && !/[A-Za-z0-9]/.test(sym)) {
              other.setAttribute('data-anw-currency', sym);
              var lr = other.getBoundingClientRect(), ir = oi.getBoundingClientRect();
              var pad = parseFloat(doc.defaultView.getComputedStyle(oi).paddingLeft) || 13;
              if (ir.width) other.style.setProperty('--anw-currency-left', (ir.left - lr.left + pad) + 'px');
              other.style.setProperty('--anw-currency-pad', pad + 'px');
            }
          }
          if (doc.getElementById('anw-iframe-styles')) return true;
          if (window.ANW.fontUrl) {
            var fl = doc.createElement('link');
            fl.rel = 'stylesheet'; fl.href = window.ANW.fontUrl;
            doc.head.appendChild(fl);
          }
          var s = doc.createElement('style');
          s.id = 'anw-iframe-styles';
          s.type = 'text/css';
          s.appendChild(doc.createTextNode(CSS_TEXT));
          doc.head.appendChild(s);

        } catch (e) { return false; }   /* not ready yet, or transiently cross-origin */
      }

      /* Sweep EVERY same-origin iframe on the page. The donation widget uses
         iframe#can_embed_iframe, but ticketed-event payment widgets use a
         different id - scanning all iframes covers both without hard-coding. */
      function sweep() {
        var frames = document.querySelectorAll('iframe');
        for (var i = 0; i < frames.length; i++) {
          var f = frames[i];
          injectIntoIframe(f);
          if (!f._anwBound) {
            f._anwBound = true;
            f.addEventListener('load', function () { injectIntoIframe(this); });
          }
        }

         swaps the iframe document without firing a 'load' we can catch in time. */
      sweep();

      var timer = setInterval(function () {

      window.ANW.watch(function () { sweep(); return false; });
    })();

  <script>
    /* MODULE (gated): pre-tick "Make This Recurring Monthly" on fundraisers.
       Runs only when ANW.recurringPretick === true. The donation form lives in
       an iframe whose document is replaced once the widget loads, so we poll
       (re-reading contentDocument each tick). Ticks once via .click() so AN's
       own handlers run; the user can still untick. */
    (function () {
      'use strict';
      if (!(window.ANW && window.ANW.recurringPretick)) return;
      var t = window.ANW.type();
      if (t !== 'fundraiser' && t !== 'default') return;
      var tries = 0, MAX = 80;            // ~24s at 300ms to find the form
      var held = 0, HOLD = 27;            // then ~8s of keeping Monthly
      var userPicked = false;
      var timer = setInterval(function () {
        tries++;
        var iframe = document.querySelector('[id^="can-fundraising-area"] iframe, iframe#can_embed_iframe');
        if (iframe) {
          try {
            var doc = iframe.contentDocument || iframe.contentWindow.document;
            var cb = doc && doc.querySelector('input[name="donation[recurring]"]');
            if (cb) {
              if (!cb._anwDone) { cb._anwDone = true; if (!cb.checked) cb.click(); }
              /* AN's frequency dropdown defaults to Weekly - start on Monthly.
                 AN's own script resets it to Weekly while it initialises,
                 which can be AFTER we first set it, so keep re-applying for a
                 few seconds - and stop for good the moment the visitor picks
                 a frequency themselves (a trusted change event). A bubbling
                 change lets AN's (jQuery) handlers see ours; the styled
                 label is set directly too. */
              var period = doc.querySelector('select[name="donation[recurring_period]"]');
              if (period && period.querySelector('option[value="recurring_monthly"]')) {
                if (!period._anwWatched) {
                  period._anwWatched = true;
                  period.addEventListener('change', function (e) { if (e.isTrusted) userPicked = true; });
                }
                if (!userPicked && period.value !== 'recurring_monthly') {
                  period.value = 'recurring_monthly';
                  period.dispatchEvent(new doc.defaultView.Event('change', { bubbles: true }));
                  var shown = period.parentNode.querySelector('.can_selectInner');
                  if (shown) shown.textContent = period.options[period.selectedIndex].text;
                }
              }
              if (userPicked || ++held >= HOLD) clearInterval(timer);
              return;
            }
          } catch (e) { /* iframe not ready / cross-origin transient */ }
        }
        if (tries >= MAX) clearInterval(timer);
      }, 300);
    })();
  </script>

        return /^(https?:|mailto:|tel:|\/|#)/i.test(u) ? u : '#';
      }

      /* REFERRAL TRACKING - every link the chain sends people along is tagged
         with where it came from, so it shows in reports:
           shares / copy link (back to this action) - AN's own source code,
             source=daisychain-share-<network> / daisychain-copy-link
           "open a link" buttons - utm_source=actionnetwork, utm_medium=daisychain,
             utm_campaign=<this action's slug>, utm_content=<button text>; links to
             another Action Network page also get source=daisychain-<slug>.
         Parameters already in a link the author typed are never overwritten. */
      var SLUG = (window.location.pathname.split('/')[2] || '').toLowerCase() || 'action';
      function codeOf(s) {
        return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
      }
      function tag(url, params, replace) {
        var u;
        try { u = new URL(url, window.location.href); } catch (e) { return url; }
        if (!/^https?:$/.test(u.protocol)) return url;
        for (var k in params) {
          if (replace || !u.searchParams.has(k)) u.searchParams.set(k, params[k]);
        }
        return u.toString();
      }
      /* The action's own address, without the visitor's incoming query
         (their own ?source= etc.) - shares start a fresh, labelled trail. */
      function actionUrl(code) {
        var base = window.location.href.split(/[?#]/)[0];
        return tag(base, { source: code }, true);
      }
      function outboundUrl(url, label) {
        if (url === '#') return url;
        var p = { utm_source: 'actionnetwork', utm_medium: 'daisychain',
                  utm_campaign: SLUG, utm_content: codeOf(label) || 'button' };
        var host = '';
        try { host = new URL(url, window.location.href).hostname; } catch (e) {}
        if (/(^|\.)actionnetwork\.org$/i.test(host)) p.source = 'daisychain-' + SLUG;
        return tag(url, p, false);
      }

      /* A custom message may place the link / action title itself with {link}
         and {title}; otherwise the link is added after it. encodeURIComponent
         escapes quotes/&/<> too, so the result is safe inside an href. */
      function shareHref(net, message, title, href) {
        var custom = String(message || '');
        var hasLink = custom.indexOf('{link}') !== -1;
        var text = (custom || title).replace(/\{title\}/g, title).replace(/\{link\}/g, href);
        var enc = encodeURIComponent;
        switch (net) {
          case 'whatsapp': return 'https://wa.me/?text=' + enc(hasLink ? text : text + '\n' + href);
          case 'facebook': return 'https://www.facebook.com/sharer/sharer.php?u=' + enc(href);
          case 'x':        return 'https://twitter.com/intent/tweet?text=' + enc(text) + (hasLink ? '' : '&url=' + enc(href));
          case 'bluesky':  return 'https://bsky.app/intent/compose?text=' + enc(hasLink ? text : text + ' ' + href);
          case 'linkedin': return 'https://www.linkedin.com/sharing/share-offsite/?url=' + enc(href);
        }
        return '#';
      }

      function buttonEl(doc, b) {
        var kind = b.action || 'page';
        var net = kind === 'copy' ? 'copy' : (kind === 'share' ? b.net : '');
        var style = b.style || 'primary';
        if (style === 'network' && !net) style = 'primary';
        var el;
        if (kind === 'share' || kind === 'url') {
          el = doc.createElement('a');
          el.href = kind === 'share'
            ? shareHref(b.net, b.message, document.title, actionUrl('daisychain-share-' + b.net))
            : outboundUrl(safeUrl(b.url), b.label);
          if (kind === 'share' || b.newTab !== false) { el.target = '_blank'; el.rel = 'noopener noreferrer'; }
        } else {
          el = doc.createElement('button');
          el.type = 'button';
          if (kind === 'copy') el.setAttribute('data-copy', '1');
          else el.setAttribute('data-page', b.page || '');
        }
        el.className = 'anw-chain-btn anw-chain-btn--' + style + (style === 'network' ? ' is-' + net : '');
        el.innerHTML = (net && ICON[net] ? ICON[net] : '') + '<span class="anw-chain-btn__text"></span>';
        el.querySelector('.anw-chain-btn__text').textContent = b.label || NET_TEXT[net] || 'Continue';   // text node, no HTML injection
        return el;
      }

      function groupEl(doc, buttons) {
        var g = doc.createElement('div');
        g.className = 'anw-chain__group';
        for (var i = 0; i < buttons.length; i++) g.appendChild(buttonEl(doc, buttons[i]));
        return g;
      }

      function show(wrap, page) {
        var doc = wrap.ownerDocument;
        wrap.innerHTML = '';
        wrap.setAttribute('data-chain-page', page.id);
        (page.blocks || []).forEach(function (blk) {
          if (blk.type === 'text') {
            var t = doc.createElement('div');
            t.className = 'anw-chain__text';
            t.innerHTML = blk.html || '';   // the wrapper author's own rich text
            /* Links typed into text get the same tracking and tab choice. */
            var links = t.querySelectorAll('a[href]');
            for (var i = 0; i < links.length; i++) {
              var a = links[i];
              a.setAttribute('href', outboundUrl(safeUrl(a.getAttribute('href')), a.textContent));
              if (CHAIN.textLinksNewTab !== false) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
              else { a.removeAttribute('target'); }
            }
            wrap.appendChild(t);
          } else if (blk.type === 'button') {
            wrap.appendChild(groupEl(doc, [blk]));
          } else if (blk.type === 'group') {
            if (blk.buttons && blk.buttons.length) wrap.appendChild(groupEl(doc, blk.buttons));
          } else if (blk.type === 'share') {
            var btns = (blk.nets || []).map(function (net) {
              return { action: net === 'copy' ? 'copy' : 'share', net: net, style: 'network',
                       label: (blk.labels && blk.labels[net]) || '', message: blk.message };
            });
            if (btns.length) wrap.appendChild(groupEl(doc, btns));
          }
        });
      }

      function copyLink(text, btn) {
        function flash() {
          var t = btn.querySelector('.anw-chain-btn__text'); if (!t) return;
          var prev = t.textContent; t.textContent = CHAIN.copiedText || 'Copied!';
          setTimeout(function () { t.textContent = prev; }, 1600);
        }
        function fallback() {
          var ta = document.createElement('textarea');
          ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); } catch (e) {}
          document.body.removeChild(ta); flash();
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(flash, fallback);
        } else { fallback(); }
      }

      function build(doc) {
        var starts = CHAIN.starts || {};
        var first = pageById(starts[window.ANW.type()]) || pageById(starts['default']) || CHAIN.pages[0];
        var wrap = doc.createElement('div');
        wrap.className = 'anw-chain';
        show(wrap, first);
        wrap.addEventListener('click', function (e) {
          var btn = e.target.closest ? e.target.closest('.anw-chain-btn') : null;
          if (!btn) return;
          e.stopPropagation();   /* keep the click out of AN's #can_embed_form handlers */
          if (btn.getAttribute('data-copy')) {
            e.preventDefault();
            copyLink(actionUrl('daisychain-copy-link'), btn);
          } else if (btn.hasAttribute('data-page')) {
            e.preventDefault();
            var next = pageById(btn.getAttribute('data-page'));
            if (!next) return;
            show(wrap, next);
            /* The new page may be shorter/taller - keep its top in view. */
            if (wrap.getBoundingClientRect().top < 0 && wrap.scrollIntoView) wrap.scrollIntoView({ block: 'start' });
          }
          /* anchors: native navigation / new tab */
        });
        return wrap;
      }

      function findThankYou() {
        return document.getElementById('can_thank_you') ||
               document.querySelector('#can_embed_form.can_thank_you_wrap');
      }

      function place() {
        var ty = findThankYou();
        if (!ty) return false;
        if (ty.querySelector('.anw-chain')) return true;   // already added
        ty.appendChild(build(ty.ownerDocument));
        if (CHAIN.hideThankYouText && ty.id === 'can_thank_you') ty.classList.add('anw-chain-only');
        return true;
      }

      /* The shared page watcher catches the inline thank-you straight away. */
      window.ANW.watch(place);
    })();
  </script>

  <script>
    /* MODULE: mobile "jump to action" button (ANW.jumpToAction). On narrow
       viewports the intro content and the form stack vertically, so we float
       a button at the bottom of the screen that scrolls straight to the
       form. Not on fundraisers - the donation form is the page there. CSS
       keeps it desktop-hidden; here we just track visibility: shown while
       the form (#can_sidebar) is still below the viewport, hidden once it's
       reached or passed. The
       form loads async and is replaced by the thank-you markup after a
       successful action, so we re-resolve the target on every DOM mutation
       rather than finding it once. */
    (function () {
      'use strict';
      if (window.ANW && window.ANW.jumpToAction === false) return;
      if (window.ANW.type() === 'fundraiser') return;

      var LABEL = (window.ANW && window.ANW.jumpToActionLabel) || 'Take action';
      var btn, io, currentTarget;

      function findTarget() {
        /* Nothing left to jump to once the action has been taken. */
        if (document.querySelector('#can_thank_you, #can_embed_form.can_thank_you_wrap')) return null;
        return document.querySelector('#can_sidebar');
      }

      function build() {
        btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'anw-jump';
        btn.innerHTML = '<span class="anw-jump__text"></span>' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16M5 13l7 7 7-7"/></svg>';
        btn.querySelector('.anw-jump__text').textContent = LABEL;   // text node, no HTML injection
        btn.addEventListener('click', function () {
          if (currentTarget) currentTarget.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        document.body.appendChild(btn);
      }

      function watch(target) {
        currentTarget = target;
        if (io) io.disconnect();
        io = new IntersectionObserver(function (entries) {
          var entry = entries[0];
          /* Still ahead (below the viewport) and not yet reached = intro state. */
          var showIntro = !entry.isIntersecting && entry.boundingClientRect.top > 0;
          btn.classList.toggle('is-visible', showIntro);
        }, { threshold: 0 });
        io.observe(target);
      }

      function sync() {
        if (!document.body || !window.IntersectionObserver) return;
        var target = findTarget();
        if (!target) {
          if (btn) btn.classList.remove('is-visible');
          currentTarget = null;
          if (io) { io.disconnect(); io = null; }
          return;
        }
        if (target === currentTarget) return;
        if (!btn) build();
        watch(target);
      }

      window.ANW.watch(function () { sync(); return false; });
    })();
  </script>

        function check() {
          if (document.querySelector('#can_embed_form input, #can_embed_form .entry-title')) {
            fadeLoader(); return true;

          var iframe = document.querySelector('[id^="can-fundraising-area"] iframe');
          if (iframe && !iframe._anwWatching) {
            iframe._anwWatching = true;
            iframe.addEventListener('load', function () { setTimeout(fadeLoader, 600); });

          }
          return false;
        }
        window.ANW.watch(check);
      })();
